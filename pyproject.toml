[project]
name = "my_dbt_dagster_project"
version = "0.1.0"
description = "Dagster orchestration for the dbt Airbnb project (DuckDB)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster==1.13.29",
    "dagster-dbt==0.29.29",
    "dagster-webserver==1.13.29",
    "dbt-core==1.12.3",
    "dbt-duckdb==1.11.0",
    "protobuf>=6.33.5,<7",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "my_dbt_dagster_project.definitions"
code_location_name = "my_dbt_dagster_project"